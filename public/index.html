<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backtest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Search bar -->
    <header class="mb-8">
      <div class="flex flex-wrap items-end gap-4 p-4 rounded-xl bg-slate-900/80 border border-slate-800 shadow-lg">
        <div class="flex-1 min-w-[120px]">
          <label for="ticker" class="block text-xs font-medium text-slate-400 mb-1">Ticker</label>
          <input
            id="ticker"
            type="text"
            placeholder="e.g. NVDA"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition"
          />
        </div>
        <div class="min-w-[140px]">
          <label for="start_date" class="block text-xs font-medium text-slate-400 mb-1">Start Date</label>
          <input
            id="start_date"
            type="date"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition"
          />
        </div>
        <div class="min-w-[140px]">
          <label for="end_date" class="block text-xs font-medium text-slate-400 mb-1">End Date</label>
          <input
            id="end_date"
            type="date"
            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none transition"
          />
        </div>
        <button
          id="run-btn"
          type="button"
          class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-lg shadow-emerald-900/30 transition focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-950 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Run Backtest
        </button>
      </div>
      <p id="error-msg" class="mt-2 text-sm text-red-400 hidden"></p>
    </header>

    <!-- Two-column layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left: Performance Metrics (1/3) -->
      <aside class="lg:col-span-1 order-2 lg:order-1">
        <div class="rounded-xl bg-slate-900/80 border border-slate-800 overflow-hidden shadow-lg sticky top-4">
          <h2 class="px-4 py-3 text-sm font-semibold text-slate-300 uppercase tracking-wider border-b border-slate-800">
            Performance Metrics
          </h2>
          <div id="metrics-placeholder" class="p-4 text-slate-500 text-sm">
            Enter a ticker and run a backtest to see metrics.
          </div>
          <table id="metrics-table" class="w-full text-sm hidden">
            <tbody id="metrics-tbody"></tbody>
          </table>
        </div>
      </aside>

      <!-- Right: Chart (2/3) -->
      <section class="lg:col-span-2 order-1 lg:order-2">
        <div class="rounded-xl bg-slate-900/80 border border-slate-800 overflow-hidden shadow-lg min-h-[420px]">
          <div id="chart-placeholder" class="flex items-center justify-center min-h-[420px] text-slate-500 text-sm">
            Chart will appear here after you run a backtest.
          </div>
          <div id="chart-container" class="hidden w-full min-h-[420px] p-2"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const tickerEl = document.getElementById('ticker');
      const startDateEl = document.getElementById('start_date');
      const endDateEl = document.getElementById('end_date');
      const runBtn = document.getElementById('run-btn');
      const errorMsg = document.getElementById('error-msg');
      const metricsPlaceholder = document.getElementById('metrics-placeholder');
      const metricsTable = document.getElementById('metrics-table');
      const metricsTbody = document.getElementById('metrics-tbody');
      const chartPlaceholder = document.getElementById('chart-placeholder');
      const chartContainer = document.getElementById('chart-container');

      // Default dates: 2 years back
      const end = new Date();
      const start = new Date();
      start.setFullYear(start.getFullYear() - 2);
      endDateEl.value = end.toISOString().slice(0, 10);
      startDateEl.value = start.toISOString().slice(0, 10);

      function showError(msg) {
        errorMsg.textContent = msg || '';
        errorMsg.classList.toggle('hidden', !msg);
      }

      function setLoading(loading) {
        runBtn.disabled = loading;
        runBtn.textContent = loading ? 'Running…' : 'Run Backtest';
      }

      function renderMetrics(metrics) {
        if (!metrics || Object.keys(metrics).length === 0) {
          metricsPlaceholder.classList.remove('hidden');
          metricsTable.classList.add('hidden');
          return;
        }
        metricsPlaceholder.classList.add('hidden');
        metricsTable.classList.remove('hidden');
        metricsTbody.innerHTML = '';
        for (const [label, value] of Object.entries(metrics)) {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-slate-800 last:border-0';
          tr.innerHTML = `
            <td class="px-4 py-3 text-slate-400">${label}</td>
            <td class="px-4 py-3 text-right font-medium text-slate-100">${value}</td>
          `;
          metricsTbody.appendChild(tr);
        }
      }

      function renderChart(chartData, ticker, benchmarkTicker) {
        if (!chartData || chartData.length === 0) {
          chartPlaceholder.classList.remove('hidden');
          chartContainer.classList.add('hidden');
          return;
        }
        chartPlaceholder.classList.add('hidden');
        chartContainer.classList.remove('hidden');

        const dates = chartData.map(d => d.date);
        const strategy = chartData.map(d => d.strategy_equity);
        const buyHold = chartData.map(d => d.buy_hold);
        const benchmark = chartData.map(d => d.benchmark_equity);

        const trace1 = { x: dates, y: strategy, type: 'scatter', mode: 'lines', name: `Strategy (${ticker} MA50)`, line: { width: 2 } };
        const trace2 = { x: dates, y: buyHold, type: 'scatter', mode: 'lines', name: `Buy & Hold (${ticker})`, line: { width: 1.5, dash: 'dot' } };
        const trace3 = { x: dates, y: benchmark, type: 'scatter', mode: 'lines', name: `Benchmark (${benchmarkTicker})`, line: { width: 1.5, dash: 'dash' } };

        const layout = {
          margin: { t: 40, r: 20, b: 40, l: 50 },
          paper_bgcolor: 'rgba(15, 23, 42, 0)',
          plot_bgcolor: 'rgba(15, 23, 42, 0)',
          font: { color: '#94a3b8', family: 'DM Sans, system-ui, sans-serif' },
          xaxis: { gridcolor: 'rgba(71, 85, 105, 0.3)', zeroline: false },
          yaxis: { title: 'Cumulative Return', gridcolor: 'rgba(71, 85, 105, 0.3)', zeroline: false },
          legend: { x: 0, y: 1.05, orientation: 'h' },
          hovermode: 'x unified',
        };

        Plotly.newPlot(chartContainer, [trace1, trace2, trace3], layout, { responsive: true });
      }

      runBtn.addEventListener('click', async function () {
        const ticker = tickerEl.value.trim();
        const start_date = startDateEl.value;
        const end_date = endDateEl.value;
        showError('');

        if (!ticker) {
          showError('Please enter a ticker.');
          return;
        }
        if (!start_date || !end_date) {
          showError('Please select start and end dates.');
          return;
        }
        if (new Date(start_date) > new Date(end_date)) {
          showError('Start date must be before end date.');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/run_backtest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticker, start_date, end_date }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showError(data.detail || res.statusText || 'Backtest failed');
            return;
          }
          renderMetrics(data.metrics);
          renderChart(data.chart_data, data.ticker, data.benchmark_ticker);
        } catch (e) {
          showError('Network error: ' + (e.message || 'Could not reach server'));
        } finally {
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
